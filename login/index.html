<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>Log in — Oriptos TikTok Engine</title>
  <meta name="description" content="Log in to Oriptos TikTok Social Media Hub & Scheduler with TikTok OAuth or Email."/>
  <link rel="icon" href="/assets/pandaping-icon-blink.avif" type="image/avif"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F5F5F2;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.02em; letter-spacing: -0.01em;
      color: #101613;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .website-announcement {
      min-height: 40px;
      padding: 8px 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #01A095;
      color: #0A0A0A;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }
    .website-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #F5F5F2;
      border-bottom: 1px solid #E5E7EB;
    }
    .website-header-inner {
      padding: 10px 32px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .website-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #101613;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }
    .pandaping-auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 50px 24px;
      overflow: hidden;
    }
    .pandaping-login-art {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .pandaping-login-art-left {
      left: 12%;
      width: 240px;
      height: auto;
    }
    .pandaping-login-art-right {
      right: 12%;
      width: 250px;
      height: auto;
    }
    @media (max-width: 1024px) {
      .pandaping-login-art { display: none; }
    }
    .pandaping-auth-card {
      position: relative;
      z-index: 2;
      background: transparent;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pandaping-auth-card h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #101613;
      letter-spacing: -0.02em;
    }
    .pandaping-login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pandaping-login-form label {
      font-size: 13px;
      font-weight: 600;
      color: #4B5563;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pandaping-login-form input {
      height: 50px;
      border-radius: 12px;
      border: 1px solid #D1D5DB;
      background: #E8E8E4;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 500;
      color: #101613;
      outline: none;
      transition: all 0.2s;
    }
    .pandaping-login-form input:focus {
      background: #FFFFFF;
      border-color: #01A095;
      box-shadow: 0 0 0 3px rgba(1, 160, 149, 0.15);
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      box-sizing: border-box;
      padding-right: 44px;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #6B7280;
      padding: 4px;
    }
    .btn-login-submit {
      margin-top: 4px;
      height: 52px;
      border-radius: 999px;
      background: #1B74E4;
      color: #FFFFFF;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-login-submit:hover {
      background: #1565C0;
      transform: translateY(-1px);
    }
    /* TikTok Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #9CA3AF;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 12px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #D1D5DB;
    }
    .auth-divider::before { margin-right: 12px; }
    .auth-divider::after { margin-left: 12px; }

    /* TikTok Official Login Button */
    .btn-tiktok-login {
      height: 52px;
      border-radius: 999px;
      background: #000000;
      color: #FFFFFF;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-decoration: none;
    }
    .btn-tiktok-login:hover {
      background: #1A1A1A;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .btn-header-login {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 10px 0 20px;
      border-radius: 999px;
      border: 1.5px solid #101613;
      background: transparent;
      color: #101613;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    .login-arrow-disc {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #101613;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-tiktok-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #000000;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-tiktok-header:hover {
      background: #222222;
    }
  </style>
</head>
<body>

  <!-- Announcement Bar -->
  <aside class="website-announcement" aria-label="Oriptos announcement">
    <span>
      <strong style="margin-right: 8px; font-size: 11px; letter-spacing: 0.04em;">TIKTOK COMMERCE</strong>
      Scale video publishing and bulk automation with Oriptos TikTok Engine.
      <a href="/" style="color: inherit; margin-left: 5px; font-weight: 600;">Explore Platform</a>
    </span>
  </aside>

  <!-- Header -->
  <header class="website-header">
    <div class="website-header-inner">
      <a href="/" class="website-logo">
        <img src="/assets/pandaping-icon-blink.avif" alt="Oriptos" width="40" height="40" style="border-radius: 10px; display: block;"/>
        <span>Oriptos</span>
      </a>

      <div style="display: flex; align-items: center; gap: 12px;">
        <!-- Header TikTok Action Button -->
        <a href="#" onclick="startTikTokConnect(event)" class="btn-tiktok-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.34 22a6.33 6.33 0 0 0 6.33-6.33V9.42a8.16 8.16 0 0 0 4.92 1.62V7.61a4.85 4.85 0 0 1-1-.92z"/>
          </svg>
          <span>Continue with TikTok</span>
        </a>

        <a href="/login" class="btn-header-login">
          <span>Login</span>
          <span class="login-arrow-disc">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12h15M13 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
      </div>
    </div>
  </header>

  <!-- Login Main Content with Exact Panda Art -->
  <main class="pandaping-auth-page">
    <img src="/assets/login-magnifier.webp" alt="Panda Magnifier" class="pandaping-login-art pandaping-login-art-left"/>
    <img src="/assets/login-heart.webp" alt="Panda Heart" class="pandaping-login-art pandaping-login-art-right"/>

    <section class="pandaping-auth-card">
      <h1 id="auth-heading">Log in</h1>

      <form class="pandaping-login-form" id="auth-form" onsubmit="handleLogin(event)">
        <div id="auth-name-row" style="display:none; gap:12px;">
          <label style="flex:1;">
            First name
            <input type="text" id="login-first-name" placeholder="First name" autocomplete="given-name"/>
          </label>
          <label style="flex:1;">
            Last name
            <input type="text" id="login-last-name" placeholder="Last name" autocomplete="family-name"/>
          </label>
        </div>

        <label>
          Email address
          <input type="email" id="login-email" required placeholder="you@company.com" autocomplete="email"/>
        </label>

        <label>
          Password
          <div class="password-wrapper">
            <input type="password" id="login-password" required placeholder="Your password" autocomplete="current-password"/>
            <button type="button" class="password-toggle-btn" onclick="togglePassword()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>

        <p id="auth-message" role="alert" style="display:none; margin:0; font-size:13px; font-weight:600; line-height:1.45;"></p>

        <button type="submit" class="btn-login-submit" id="btn-auth-submit">
          Log In
        </button>

        <button type="button" id="auth-mode-toggle" onclick="toggleAuthMode()" style="background:none; border:none; padding:2px; color:#1B74E4; font-size:13px; font-weight:700; cursor:pointer;">
          New here? Create an account
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>Or sign in with</span>
        </div>

        <!-- Official Continue with TikTok Button -->
        <a href="#" onclick="startTikTokConnect(event)" class="btn-tiktok-login">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.34 22a6.33 6.33 0 0 0 6.33-6.33V9.42a8.16 8.16 0 0 0 4.92 1.62V7.61a4.85 4.85 0 0 1-1-.92z"/>
          </svg>
          <span>Continue with TikTok</span>
        </a>
      </form>
    </section>
  </main>

  <script>
    // Supabase project wiring (publishable values only — safe in the browser).
    // SUPABASE_ANON_KEY is a placeholder in this working copy; the real
    // publishable key is injected by the parent at integration time.
    const SUPABASE_URL = 'https://nnkvruflauabevuhimhk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-H9oPDTFv1laCwR7vIebzQ_IfVF6AkH';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let authMode = 'signin'; // 'signin' | 'signup'

    function togglePassword() {
      const field = document.getElementById('login-password');
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function setAuthMessage(message, isError) {
      const el = document.getElementById('auth-message');
      if (!el) return;
      el.textContent = message || '';
      el.style.display = message ? 'block' : 'none';
      el.style.color = isError ? '#B91C1C' : '#047857';
    }

    function toggleAuthMode() {
      authMode = authMode === 'signin' ? 'signup' : 'signin';
      const heading = document.getElementById('auth-heading');
      const submit = document.getElementById('btn-auth-submit');
      const toggle = document.getElementById('auth-mode-toggle');
      const password = document.getElementById('login-password');
      const nameRow = document.getElementById('auth-name-row');
      if (nameRow) nameRow.style.display = authMode === 'signup' ? 'flex' : 'none';
      if (heading) heading.textContent = authMode === 'signup' ? 'Create account' : 'Log in';
      if (submit) submit.textContent = authMode === 'signup' ? 'Sign Up' : 'Log In';
      if (toggle) toggle.textContent = authMode === 'signup' ? 'Already have an account? Log in' : 'New here? Create an account';
      if (password) password.setAttribute('autocomplete', authMode === 'signup' ? 'new-password' : 'current-password');
      setAuthMessage('', false);
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (!supabaseClient) {
        setAuthMessage('Login is not configured yet. Please try again later.', true);
        return;
      }
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-auth-submit');
      setAuthMessage('', false);
      btn.disabled = true;
      btn.textContent = authMode === 'signup' ? 'Creating account...' : 'Logging in...';
      try {
        if (authMode === 'signup') {
          const firstName = document.getElementById('login-first-name').value.trim();
          const lastName = document.getElementById('login-last-name').value.trim();
          if (!firstName || !lastName) {
            setAuthMessage('Please enter your first and last name.', true);
            return;
          }
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { first_name: firstName, last_name: lastName, display_name: firstName + ' ' + lastName } }
          });
          if (error) throw error;
          if (data.session) {
            window.location.href = '/dashboard';
            return;
          }
          toggleAuthMode(); // back to sign-in
          setAuthMessage('Account created. If email confirmation is enabled, confirm your email and then log in.', false);
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = '/dashboard';
        }
      } catch (err) {
        setAuthMessage((err && err.message) || 'Authentication failed. Please try again.', true);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'Sign Up' : 'Log In';
      }
    }

    // "Continue with TikTok" — TikTok is a PRIMARY sign-in here, not a
    // connect-only extra: the button ALWAYS starts the OAuth flow. The
    // start endpoint is fetched (a plain navigation cannot carry the
    // site session — it lives in supabase-js localStorage, not a cookie):
    // with a session, its JWT goes along and the flow CONNECTS TikTok to
    // the signed-in account; without one, the same fetch starts LOGIN
    // mode, and the callback creates the site account on first use and
    // hands the session back via the #tt_session fragment handled below.
    // Either way the oauth_state cookie set by the fetch response is
    // stored by the browser (same-origin fetch), so the callback's
    // cookie check still passes when TikTok redirects back.
    async function startTikTokConnect(e) {
      if (e) e.preventDefault();
      if (!supabaseClient) {
        setAuthMessage('Login is not configured yet. Please try again later.', true);
        return;
      }
      try {
        const { data } = await supabaseClient.auth.getSession();
        const token = data && data.session ? data.session.access_token : null;
        const headers = { 'Accept': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch('/auth/tiktok/start', { headers });
        const payload = await res.json().catch(() => null);
        if (!res.ok || !payload || !payload.url) {
          throw new Error((payload && payload.message) || 'Could not start TikTok sign-in (' + res.status + ').');
        }
        window.location.assign(payload.url);
      } catch (err) {
        setAuthMessage((err && err.message) || 'Could not start TikTok sign-in.', true);
      }
    }

    // TikTok LOGIN mode lands back on this page from the callback with a
    // one-time token in the URL fragment (#tt_session=<hashed_token>).
    // Exchange it for a real Supabase session, scrub the fragment from
    // history, and continue to the dashboard. Returns true when a
    // tt_session fragment was present (handled, successfully or not), so
    // the signed-in check below does not race it.
    async function completeTikTokSessionFromHash() {
      const match = (window.location.hash || '').match(/tt_session=([^&]+)/);
      if (!match) return false;
      const tokenHash = decodeURIComponent(match[1]);
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
      if (!supabaseClient) {
        setAuthMessage('TikTok sign-in could not be completed — please try again.', true);
        return true;
      }
      try {
        const { error } = await supabaseClient.auth.verifyOtp({ token_hash: tokenHash, type: 'magiclink' });
        if (error) throw error;
        window.location.assign('/dashboard?connected=tiktok');
      } catch (err) {
        setAuthMessage('TikTok sign-in could not be completed — please try again.', true);
      }
      return true;
    }

    (async () => {
      // A TikTok sign-in completing takes precedence over everything.
      if (await completeTikTokSessionFromHash()) return;
      // Already signed in? Go straight to the dashboard.
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) window.location.href = '/dashboard';
      } catch (_) { /* stay on the login page */ }
    })();
  </script>
</body>
</html>
